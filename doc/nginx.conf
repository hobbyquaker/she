# Sample nginx configuration for she behind a reverse proxy
#
# This example exposes she at https://she.home.example with TLS termination
# and delegates authentication to authentik (forward auth / proxy mode).
#
# she configuration (config.json):
#   {
#     "auth": "proxy",
#     "proxyHeader": "X-Remote-User",
#     "bindAddress": "127.0.0.1",
#     "port": 8080
#   }
#
# When "auth" is "proxy", she trusts the value of the configured header and
# grants access if it is present and non-empty.  The header must be set by a
# trusted proxy — NEVER by the client.  nginx strips any client-supplied
# X-Remote-User header before passing the request upstream, so the setup
# below is safe.
#
# Requirements:
#   - nginx 1.18+ (or any version supporting auth_request)
#   - An authentik instance reachable at https://auth.home.example
#   - TLS certificate (e.g. from Let's Encrypt via certbot / acme.sh)

# ── authentik outpost ─────────────────────────────────────────────────────────
# Separate server block (or upstream) for the authentik embedded outpost.
# Adjust the address / port to match your authentik deployment.
upstream authentik-outpost {
    server 127.0.0.1:9000;
    keepalive 10;
}

# ── she upstream ─────────────────────────────────────────────────────────────
upstream she {
    server 127.0.0.1:8080;
    keepalive 10;
}

# ── HTTPS server for she ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name she.home.example;

    ssl_certificate     /etc/letsencrypt/live/she.home.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/she.home.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── authentik forward-auth sub-request ───────────────────────────────────
    location /outpost.goauthentik.io {
        proxy_pass https://authentik-outpost/outpost.goauthentik.io;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        # authentik sets X-Remote-User on success; nginx forwards it upstream
    }

    # ── main location ─────────────────────────────────────────────────────────
    location / {
        auth_request /outpost.goauthentik.io/auth/nginx;

        # Pass the user identity header set by authentik to she
        auth_request_set $authentik_user $upstream_http_x_authentik_username;
        proxy_set_header X-Remote-User $authentik_user;

        # Strip any client-supplied user header to prevent spoofing
        proxy_set_header X-Remote-User "";   # reset first ...
        proxy_set_header X-Remote-User $authentik_user;  # ... then set from auth_request

        # Redirect to authentik login on 401/403
        error_page 401 = @authentik_signin;
        error_page 403 = @authentik_forbidden;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;  # keep WS connections alive

        proxy_pass http://she;
    }

    location @authentik_signin {
        return 302 https://auth.home.example/outpost.goauthentik.io/start?rd=$scheme://$http_host$request_uri;
    }

    location @authentik_forbidden {
        return 403;
    }
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name she.home.example;
    return 301 https://$host$request_uri;
}
