name: Publish to npm

on:
    workflow_dispatch:

permissions:
    contents: read
    id-token: write # required for npm trusted publishing (OIDC)
    actions: read

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '26'

            - name: Install dependencies
              run: npm ci

            - name: Build web frontend
              run: npm run build:web

            # a pre-release version (3.0.0-beta.0) goes to the dist-tag `next`, never to `latest`:
            # `npm install -g smart-home-engine` and the update check of older versions keep
            # resolving the last stable release
            - name: Publish to npm
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  case "$VERSION" in *-*) TAG=next ;; *) TAG=latest ;; esac
                  echo "publishing $VERSION with dist-tag $TAG"
                  npm publish --tag "$TAG"
