name: Create Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # full history needed to enumerate commits between tags

            - name: Get previous tag
              id: prev-tag
              run: |
                  PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
                  echo "tag=$PREV" >> $GITHUB_OUTPUT

            - name: Build changelog
              id: changelog
              run: |
                  PREV="${{ steps.prev-tag.outputs.tag }}"
                  if [ -n "$PREV" ]; then
                      LOG=$(git log "${PREV}..${{ github.ref_name }}" --pretty=format:"- %h %s" --no-merges)
                  else
                      LOG=$(git log "${{ github.ref_name }}" --pretty=format:"- %h %s" --no-merges)
                  fi
                  {
                      echo "log<<EOF"
                      echo "$LOG"
                      echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  CHANGELOG: ${{ steps.changelog.outputs.log }}
              run: |
                  gh release create "${{ github.ref_name }}" \
                      --title "${{ github.ref_name }}" \
                      --notes "$CHANGELOG"
