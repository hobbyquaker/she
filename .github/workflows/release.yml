name: Create Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '26'
                  cache: 'npm'

            - run: npm ci

            - run: npm run lint:ci

    test:
        name: Test
        needs: lint
        uses: ./.github/workflows/test.yml

    release:
        name: Create GitHub Release
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # full history needed to enumerate commits between tags

            - name: Get previous tag
              id: prev-tag
              run: |
                  PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
                  echo "tag=$PREV" >> $GITHUB_OUTPUT

            - name: Build changelog
              id: changelog
              run: |
                  PREV="${{ steps.prev-tag.outputs.tag }}"
                  if [ -n "$PREV" ]; then
                      LOG=$(git log "${PREV}..${{ github.ref_name }}" --pretty=format:"- %h %s" --no-merges)
                  else
                      LOG=$(git log "${{ github.ref_name }}" --pretty=format:"- %h %s" --no-merges)
                  fi
                  {
                      echo "log<<EOF"
                      echo "$LOG"
                      echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  CHANGELOG: ${{ steps.changelog.outputs.log }}
              run: |
                  gh release create "${{ github.ref_name }}" \
                      --title "${{ github.ref_name }}" \
                      --notes "$CHANGELOG"

    publish:
        name: Publish to npm
        needs: [test, release]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            actions: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '26'

            - name: Install dependencies
              run: npm ci

            - name: Build web frontend
              run: npm run build:web

            - name: Publish to npm
              run: npm publish
