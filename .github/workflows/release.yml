name: Create Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '26'
                  cache: 'npm'

            - run: npm ci

            - run: npm run lint:ci

    test:
        name: Test
        needs: lint
        uses: ./.github/workflows/test.yml

    release:
        name: Create GitHub Release
        needs: test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0 # full history needed to enumerate commits between tags

            - name: Get previous tag
              id: prev-tag
              run: |
                  PREV=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -1)
                  echo "tag=$PREV" >> $GITHUB_OUTPUT

            - name: Build changelog
              id: changelog
              run: |
                  PREV="${{ steps.prev-tag.outputs.tag }}"
                  if [ -n "$PREV" ]; then
                      LOG=$(git log "${PREV}..${{ github.ref_name }}" --pretty=format:"- %h %s" --no-merges)
                  else
                      LOG=$(git log "${{ github.ref_name }}" --pretty=format:"- %h %s" --no-merges)
                  fi
                  {
                      echo "log<<EOF"
                      echo "$LOG"
                      echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  CHANGELOG: ${{ steps.changelog.outputs.log }}
              run: |
                  gh release create "${{ github.ref_name }}" \
                      --title "${{ github.ref_name }}" \
                      --notes "$CHANGELOG"

    docker:
        name: Build and push Docker image
        needs: [test, release]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # push to ghcr.io
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            # arm64 is emulated only for the runtime `npm ci` — the web build stage in the
            # Dockerfile is pinned to the native builder architecture.
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image tags and labels
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository_owner }}/she
                  # latest=auto: a pre-release tag (v1.2.0-rc.1) does not move `latest`
                  flavor: latest=auto
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    publish:
        name: Publish to npm
        needs: [test, release]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            actions: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '26'

            - name: Install dependencies
              run: npm ci

            - name: Build web frontend
              run: npm run build:web

            - name: Publish to npm
              run: npm publish
