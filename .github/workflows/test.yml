name: Test

on:
    push:
        branches:
            - '**' # branches only — tag pushes are handled by release.yml
    pull_request:
    workflow_call: # allow release.yml to reuse this workflow as a gate

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: ['26.x']

        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'

            - run: npm ci

            - run: npm test

            - run: npm run test:integration
